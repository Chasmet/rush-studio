name: Validation Premium 0.49 EUR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android
        uses: android-actions/setup-android@v3
      - name: Android Platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Compiler et analyser les sources
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug
      - name: Déposer APK de test non signé Release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rush-studio-premium-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
