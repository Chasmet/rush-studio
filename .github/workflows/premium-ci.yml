name: Rush Studio - Premium Billing (branche de preparation)
on:
  push:
    branches:
      - feature/freemium-3jours-playbilling
    paths:
      - "app/**"
      - "index.html"
      - "gradlew"
      - "gradle/wrapper/**"
      - ".github/workflows/premium-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "index.html"
      - "gradlew"
      - "gradle/wrapper/**"
      - ".github/workflows/premium-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compiler sans modifier la version Play Store
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Publier APK de verification uniquement
        uses: actions/upload-artifact@v4
        with:
          name: rush-studio-premium-preview-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
