name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compute version
        id: version
        shell: bash
        run: |
          echo "name=2.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=$((20000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Prepare Gradle
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ steps.version.outputs.code }}

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: rush-studio-debug-${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rush-studio-release.jks"

      - name: Build signed release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/rush-studio-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ steps.version.outputs.code }}

      - name: Rename release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk rush-studio-${{ steps.version.outputs.name }}.apk

      - name: Create GitHub Release
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Rush Studio v${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: rush-studio-${{ steps.version.outputs.name }}.apk
