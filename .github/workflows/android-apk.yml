name: Rush Studio Android · APK test et AAB Google Play

on:
  push:
    branches: [main, feat/sync30-playstore-20261008]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rush-studio-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer la plateforme Android 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36"

      - name: Contrôler les icônes originales
        run: python3 scripts/check_png.py

      - name: Préparer Gradle
        run: chmod +x gradlew

      - name: Préparer la version et la signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "APP_VERSION=2.2.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "APP_CODE=$((22000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PWD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PWD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rush-studio-upload.jks"
            chmod 600 "$RUNNER_TEMP/rush-studio-upload.jks"
            echo "UPLOAD_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "UPLOAD_SIGNED=false" >> "$GITHUB_ENV"
            echo "::notice::AAB sans signature : renseigner les quatre secrets Android pour publier."
          fi

      - name: Construire APK debug et AAB release
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/rush-studio-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:bundleRelease \
            -PversionCode="$APP_CODE" -PversionName="$APP_VERSION"
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Conserver APK de test et AAB
        uses: actions/upload-artifact@v4
        with:
          name: rush-studio-android-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Résumé publication
        run: |
          echo "### Rush Studio $APP_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cible Google Play : API 36" >> "$GITHUB_STEP_SUMMARY"
          echo "- Produit intégré attendu : rush_studio_full (achat unique 0,99 €)" >> "$GITHUB_STEP_SUMMARY"
          echo "- AAB signé : $UPLOAD_SIGNED" >> "$GITHUB_STEP_SUMMARY"
          if [ "$UPLOAD_SIGNED" != true ]; then
            echo "- ⚠️ Ne pas importer l'AAB non signé dans Play Console." >> "$GITHUB_STEP_SUMMARY"
          fi
