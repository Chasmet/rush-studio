plugins {
    id 'com.android.application'
}

def ciVersionCode = providers.gradleProperty('versionCode').orNull
def ciVersionName = providers.gradleProperty('versionName').orNull

// Les identifiants réels doivent venir de la configuration CI, jamais être inventés.
def admobAppId = (System.getenv('ADMOB_APP_ID') ?: '').trim()
def admobBannerId = (System.getenv('ADMOB_BANNER_UNIT_ID') ?: '').trim()
def admobReady = (admobAppId ==~ /ca-app-pub-\d+~\d+/) && (admobBannerId ==~ /ca-app-pub-\d+\/\d+/)
def testAdmobAppId = 'ca-app-pub-3940256099942544~3347511713'

android {
    namespace 'com.chk.rushstudio'
    compileSdk 36

    defaultConfig {
        applicationId "com.chk.rushstudio"
        minSdk 24
        targetSdk 36
        versionCode ciVersionCode != null ? ciVersionCode.toInteger() : 22000
        versionName ciVersionName != null ? ciVersionName : "2.2.0"
        buildConfigField 'boolean', 'ADMOB_READY', admobReady.toString()
        buildConfigField 'String', 'ADMOB_BANNER_UNIT_ID', '"' + (admobReady ? admobBannerId : '') + '"'
    }

    signingConfigs {
        release {
            def ks = System.getenv("ANDROID_KEYSTORE_FILE")
            if (ks != null && !ks.isEmpty() && file(ks).isFile() && System.getenv("ANDROID_KEYSTORE_PASSWORD") && System.getenv("ANDROID_KEY_ALIAS") && System.getenv("ANDROID_KEY_PASSWORD")) {
                storeFile file(ks)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            // En mode debug, Google recommande ses identifiants publicitaires de test.
            manifestPlaceholders = [ADMOB_APP_ID: testAdmobAppId]
        }
        release {
            minifyEnabled false
            // Sans identifiants AdMob réels, aucune annonce en release n'est demandée.
            manifestPlaceholders = [ADMOB_APP_ID: (admobReady ? admobAppId : testAdmobAppId)]
            if (System.getenv("ANDROID_KEYSTORE_FILE") && file(System.getenv("ANDROID_KEYSTORE_FILE")).isFile()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register("syncWebAssets", Copy) {
    from(rootProject.projectDir) {
        include "index.html"
        include "manifest.json"
        include "version.json"
        include "service-worker.js"
        include "rush-icon-192.png"
        include "rush-icon-512.png"
        include "rush-affaires-icon.png"
        include "rush-courses-icon.png"
    }
    into("$projectDir/src/main/assets/www")
}
preBuild.dependsOn(syncWebAssets)

dependencies {
    // Aligner toutes les variantes Kotlin transitives (Billing / AndroidX).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation 'com.google.android.play:app-update:2.1.0'
}
